<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic To-Do</title>
  </head>

  <body class="site">
    <header class="header">
      <h1 class="header__title">ATOMIC TO-DO APP</h1>
    </header>

    <aside class="sidebar">
      <h2 class="sidebar__title">PROJECTS</h2>

      <nav class="sidebar__nav">
        <div class="sidebar__create-project-control">
          <span class="sidebar__create-project-bracket">[</span>
          <button class="sidebar__create-project-button">
            <img
              class="sidebar__create-project-icon"
              src="../images/closed-cross.svg"
              alt="Add New Project Logo"
            /><span class="sidebar__create-project-text">Add a New Project</span>
          </button>
          <span class="sidebar__create-project-bracket">]</span>
        </div>
        <ul class="sidebar__project-list"></ul>
      </nav>
    </aside>

    <main class="main">
      <div class="main__project-container"></div>
    </main>

    <footer class="footer">
      <h3 class="footer__text">
        DESIGN & CODE BY FIDEL OJIMBA |
        <a
          class="footer__link"
          href="https://github.com/EmpyreanBreaker/atomic-to-do"
          target="_blank"
          rel="noopener noreferrer"
          >SOURCE</a
        >
      </h3>
      <h3 class="footer__text">
        A NOTE OF THANKS TO
        <a
          class="footer__link"
          href="https://www.theodinproject.com/lessons/node-path-javascript-todo-list"
          target="_blank"
          rel="noopener noreferrer"
          >THE ODIN PROJECT</a
        >
      </h3>
    </footer>
  </body>
</html>
